<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b1020">
<title>Czkawka Web</title>
<link rel="stylesheet" href="/v2/style.css?v=8">
</head>
<body>
<div class="app">
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">C</span>
            <span class="brand-name">Czkawka <em>Web</em></span>
        </div>

        <nav class="tool-tabs" id="tool-tabs" role="tablist" aria-label="Select a tool"></nav>

        <div class="topbar-actions">
            <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch color theme" title="Switch theme">
                <span data-theme-icon aria-hidden="true">◐</span>
            </button>
            <a class="ghost-link" href="/classic/" title="Switch to the classic interface">Classic UI</a>
        </div>
    </header>

    <main class="layout">
        <aside class="sidebar" aria-label="Scan settings">
            <section class="card">
                <h2 class="card-title">Directories</h2>

                <div class="field">
                    <label for="new-included">Included paths</label>
                    <div class="dir-picker">
                        <input type="text" id="new-included" placeholder="/home/user/Downloads" autocomplete="off" spellcheck="false">
                        <button class="btn btn-icon" id="add-included" type="button" aria-label="Add included path" title="Add">+</button>
                        <button class="btn btn-icon" id="browse-included" type="button" aria-label="Browse for included directory" title="Browse">📁</button>
                        <button class="btn btn-icon" id="recent-included" type="button" aria-label="Recent included directories" aria-expanded="false" title="Recent">🕘</button>
                    </div>
                    <div class="recent-menu" id="recent-included-menu" hidden>
                        <div class="recent-list" id="recent-included-list"></div>
                        <button class="btn btn-ghost recent-clear" id="recent-clear" type="button">Clear history</button>
                    </div>
                    <ul class="chips" id="included-list"></ul>
                </div>

                <div class="field">
                    <label for="new-excluded">Excluded paths</label>
                    <div class="dir-picker">
                        <input type="text" id="new-excluded" placeholder="/home/user/temp" autocomplete="off" spellcheck="false">
                        <button class="btn btn-icon" id="add-excluded" type="button" aria-label="Add excluded path" title="Add">+</button>
                        <button class="btn btn-icon" id="browse-excluded" type="button" aria-label="Browse for excluded directory" title="Browse">📁</button>
                        <button class="btn btn-icon" id="recent-excluded" type="button" aria-label="Recent excluded directories" aria-expanded="false" title="Recent">🕘</button>
                    </div>
                    <div class="recent-menu" id="recent-excluded-menu" hidden>
                        <div class="recent-list" id="recent-excluded-list"></div>
                    </div>
                    <ul class="chips" id="excluded-list"></ul>
                </div>
            </section>

            <section class="card">
                <h2 class="card-title">General</h2>
                <div class="options">
                    <label class="switch"><input type="checkbox" id="recursive" checked><span>Recursive</span></label>
                    <label class="switch"><input type="checkbox" id="use-cache" checked><span>Use cache</span></label>
                    <label class="inline-field">Min size
                        <input type="number" id="min-size" value="1024" min="0" step="1"> bytes
                    </label>
                </div>
            </section>

            <section class="card">
                <h2 class="card-title" id="tool-options-title">Tool options</h2>
                <div class="options" id="tool-options"></div>
            </section>

            <div class="scan-actions">
                <button class="btn btn-primary btn-block" id="scan-btn" type="button">Scan</button>
                <button class="btn btn-danger btn-block" id="stop-btn" type="button" hidden>Stop</button>
            </div>

            <div class="progress" id="progress" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Scan progress">
                <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
                <div class="progress-meta">
                    <span id="progress-stage">Starting…</span>
                    <span id="progress-pct">0%</span>
                </div>
            </div>
        </aside>

        <section class="content" aria-label="Scan results">
            <div class="results-head">
                <div class="results-heading">
                    <h2 class="results-title">Results</h2>
                    <p class="results-summary" id="results-summary" aria-live="polite"></p>
                </div>
                <div class="results-toolbar" id="results-toolbar"></div>
            </div>

            <div class="table-wrap" id="table-wrap">
                <table class="results-table">
                    <thead id="results-header"></thead>
                    <tbody id="results-body"></tbody>
                </table>
            </div>

            <div class="gallery" id="gallery-view" hidden></div>
            <div class="pagination" id="pagination"></div>

            <div class="empty-state" id="empty-state">
                <div class="empty-mark" aria-hidden="true">⌘</div>
                <p>Pick a tool, add at least one included path and start a scan.</p>
            </div>
        </section>
    </main>
</div>

<div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>

<div class="modal-overlay" id="browse-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="browse-title">
        <header class="modal-head">
            <h3 id="browse-title">Select a folder</h3>
            <button class="icon-btn" id="browse-close" type="button" aria-label="Close folder browser">✕</button>
        </header>
        <div class="modal-body">
            <input type="text" id="browse-path" class="mono" value="/" spellcheck="false" aria-label="Current folder path">
            <ul class="browse-list" id="browse-list" role="listbox" aria-label="Folder contents"></ul>
            <p class="browse-state" id="browse-state" hidden></p>
        </div>
        <footer class="modal-foot">
            <button class="btn btn-ghost" id="browse-cancel" type="button">Cancel</button>
            <button class="btn btn-primary" id="browse-select" type="button">Select this folder</button>
        </footer>
    </div>
</div>

<noscript>
    <p class="noscript">Czkawka Web needs JavaScript enabled to run scans.</p>
</noscript>

<script type="module" src="/v2/js/app.js?v=8"></script>
</body>
</html>
